[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stencil-generator"
version = "0.1.0"
description = "Generate 3D-printable spray-paint stencils from 2D images"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "PyQt5>=5.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "shapely>=2.0.0",
    "trimesh>=4.0.0",
    "numpy-stl>=3.0.0",
    "mapbox_earcut>=1.0.0",
    "manifold3d>=2.4.0",
    "scipy>=1.10.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
stencil-generator = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "export*", "ui*", "workers*"]

[tool.setuptools.package-data]
"*" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --no-header -p no:warnings"

[tool.setuptools]
py-modules = ["main", "config"]
